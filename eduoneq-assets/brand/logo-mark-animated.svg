<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <style>
    .halo{transform-origin:46px 43px;animation:pulse 2.6s ease-in-out 1.9s infinite}
    .ring{stroke-dasharray:126;stroke-dashoffset:126;animation:draw 1.1s cubic-bezier(.55,.06,.35,1) .15s forwards}
    .tail{stroke-dasharray:20;stroke-dashoffset:20;animation:draw .45s ease-out 1.15s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pulse{0%,100%{opacity:.28;transform:scale(1)}50%{opacity:.1;transform:scale(1.18)}}
  </style>
  <circle class="halo" cx="46" cy="43" r="30" fill="#89a9f1" opacity="0.28"/>
  <circle class="ring" cx="46" cy="43" r="20" fill="none" stroke="#1639a5" stroke-width="9" transform="rotate(-90 46 43)"/>
  <line class="tail" x1="58" y1="55" x2="72" y2="69" stroke="#1639a5" stroke-width="9" stroke-linecap="round"/>
</svg>
